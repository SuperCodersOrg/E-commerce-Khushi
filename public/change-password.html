<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | ShopEase</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <header>
        <h2>SHOPEASE</h2>
        <a href="/dashboard">Dashboard</a>
    </header>
    <main class="change-password-container">
        <div class="change-password-card">
            <h1>Change Password</h1>
            <p class="change-password-subtitle">
                Update your password to keep your account secure.
            </p>
            <form action="/auth/change-password" method="POST">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword"name="currentPassword" placeholder="Enter current password" required >
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password"required>
                <button type="submit" class="change-password-button">
                    Change Password
                </button>
            </form>
            <p class="change-password-back">
                <a href="/dashboard">Back to Dashboard</a>
            </p>
        </div>

    </main>

</body>
</html>
